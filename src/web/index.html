<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>My GitHub Actions</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="favicon-quiet.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="modules/web/main.js"></script>
  </head>
  <body>
    <header class="page-header">
      <h1>My GitHub Actions</h1>
      <p class="status" id="status"></p>
      <button class="button add-repository" id="add-repository" type="button" hidden>
        Add repository
      </button>
    </header>
    <ul class="notices" id="notices" aria-label="Notices" hidden></ul>
    <div class="filters" id="filters" role="group" aria-label="Show lines by status" hidden></div>
    <main>
      <div class="empty" id="empty"></div>
      <div class="repositories" id="repositories"></div>
    </main>
    <p class="visually-hidden" id="announcer" role="status"></p>
    <noscript><p class="empty">This page needs JavaScript to show the runs.</p></noscript>
  </body>
</html>
