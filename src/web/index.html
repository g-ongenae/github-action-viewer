<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>My GitHub Actions</title>
    <link id="favicon" rel="icon" type="image/svg+xml" href="favicon-quiet.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="modules/web/main.js"></script>
  </head>
  <body>
    <header class="page-header">
      <div class="page-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg
            viewBox="0 0 24 24"
            width="19"
            height="19"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 9v7m3-9h6m-6 11h6m2-8 3-3-3-3z" />
            <rect x="3" y="4" width="6" height="5" rx="1" />
            <rect x="3" y="16" width="6" height="5" rx="1" />
            <rect x="15" y="16" width="6" height="5" rx="1" />
          </svg>
        </span>
        <h1>My GitHub Actions</h1>
      </div>
      <button class="button add-repository" id="add-repository" type="button" hidden>
        Add repository
      </button>
    </header>
    <div class="workspace">
      <aside class="filters" id="filters" aria-label="Run filters" hidden></aside>
      <main>
        <header class="activity-header">
          <h2>Workflow activity</h2>
          <p class="status" id="status"></p>
        </header>
        <details class="notice-disclosure" id="notice-disclosure" hidden>
          <summary class="notice-summary">
            <span id="notice-count"></span>
            <span class="notice-preview" id="notice-preview"></span>
          </summary>
          <ul class="notices" id="notices" aria-label="Notices"></ul>
        </details>
        <div class="empty" id="empty"></div>
        <div class="repositories" id="repositories"></div>
      </main>
    </div>
    <p class="visually-hidden" id="announcer" role="status"></p>
    <noscript><p class="empty">This page needs JavaScript to show the runs.</p></noscript>
  </body>
</html>
